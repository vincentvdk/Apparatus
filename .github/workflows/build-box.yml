---
name: build-apparatus-box
on:
  pull_request:
    branches:
      - main
    paths:
      - 'box/**'
      - 'tools/butler/**'
      - '.github/workflows/build-box.yml'
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - main
    paths:
      - 'box/**'
      - 'tools/butler/**'
      - '.github/workflows/build-box.yml'
  workflow_dispatch:

env:
  MY_IMAGE_NAME: "${{ github.event.repository.name }}-box"  # the name of the image produced by this build, matches repo names
  MY_IMAGE_DESC: "A DevOps/SRE Distrobox"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

jobs:
  build_push:
    name: Build and push image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # Checkout push-to-registry action GitHub repository
      - name: Checkout Push to Registry action
        uses: actions/checkout@v7

      - name: Generate tags
        id: generate-tags
        shell: bash
        run: |
          # Versioning scheme (see docs/releases.md):
          # - git tag vX.Y.Z on main  -> image tags X.Y.Z, latest, <sha7>
          # - push to main            -> dev-<sha7>, <yyyymmdd>, latest
          # - pull request            -> pr-<n>, <sha7> (no latest)
          SHA_SHORT="${GITHUB_SHA::7}"
          TIMESTAMP="$(date +%Y%m%d)"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            alias_tags=("${VERSION}" "${SHA_SHORT}" "latest")
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            VERSION="dev-${SHA_SHORT}"
            alias_tags=("${VERSION}" "${TIMESTAMP}" "latest")
          else
            VERSION="pr-${{ github.event.number }}-${SHA_SHORT}"
            alias_tags=("pr-${{ github.event.number }}" "${SHA_SHORT}")
          fi

          echo "Generated tags: ${alias_tags[*]} (version=${VERSION})"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "alias_tags=${alias_tags[*]}" >> $GITHUB_OUTPUT

      # Build metadata
      - name: Image Metadata
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: |
            ${{ env.MY_IMAGE_NAME }}

          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/${{ github.repository }}/main/README.md
            org.opencontainers.image.description=${{ env.MY_IMAGE_DESC }}
            org.opencontainers.image.title=${{ env.MY_IMAGE_NAME }}
            org.opencontainers.image.version=${{ steps.generate-tags.outputs.version }}

      # Build image using Buildah action
      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@v3
        with:
          containerfiles: |
            ./box/Containerfile
          # Postfix image name with -custom to make it a little more descriptive
          # Syntax: https://docs.github.com/en/actions/learn-github-actions/expressions#format
          image: ${{ env.MY_IMAGE_NAME }}
          tags: |
            ${{ steps.generate-tags.outputs.alias_tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APPARATUS_VERSION=${{ steps.generate-tags.outputs.version }}
          oci: false

      # Workaround bug where capital letters in your GitHub username make it impossible to push to GHCR.
      # https://github.com/macbre/push-to-ghcr/issues/12
      - name: Lowercase Registry
        id: registry_case
        uses: ASzc/change-string-case-action@v8
        with:
          string: ${{ env.IMAGE_REGISTRY }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image to GHCR
        uses: redhat-actions/push-to-registry@v3
        id: push
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        with:
          image: ${{ steps.build_image.outputs.image }}
          tags: ${{ steps.build_image.outputs.tags }}
          registry: ${{ steps.registry_case.outputs.lowercase }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
          extra-args: |
            --disable-content-trust

      # This section is optional and only needs to be enabled in you plan on distributing
      # your project to others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.

      # Sign container
      - uses: sigstore/cosign-installer@v4.1.3
        if: github.event_name != 'pull_request'

      - name: Sign container image
        if: github.event_name != 'pull_request'
        run: |
          cosign sign -y --key env://COSIGN_PRIVATE_KEY ${{ steps.registry_case.outputs.lowercase }}/${{ steps.build_image.outputs.image }}@${TAGS}
        env:
          TAGS: ${{ steps.push.outputs.digest }}
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
