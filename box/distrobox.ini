# Apparatus distrobox manifest for distrobox-assemble.
#
# This file is seeded to ~/.config/distrobox/distrobox.ini on first boot
# (from /usr/share/apparatus/distrobox.ini). Edit your copy to add boxes.
#
#   distrobox-assemble create --file ~/.config/distrobox/distrobox.ini
#
# Every box gets host configs (incl. theme links) synced at creation time
# via its init_hooks entry.

[apparatus-box]
image = ghcr.io/vincentvdk/apparatus-box:latest
pull = true
init_hooks = distrobox-host-exec butler sync apparatus-box

# Example: box with a dedicated home directory under ~/distrobox-homes/
# (replace YOURUSER with your username, or use an absolute path)
#
# [mybox]
# image = ghcr.io/vincentvdk/apparatus-box:latest
# home = /home/YOURUSER/distrobox-homes/mybox
# pull = true
# init_hooks = distrobox-host-exec butler sync mybox
