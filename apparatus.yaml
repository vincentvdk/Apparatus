# Apparatus Core Component Manifest
# This file defines the stable, expected versions for all major external dependencies
# to ensure reproducible builds across all development artifacts.
# Format: component_name: "^major.minor.patch" or ">=X.Y.Z"

# OS Base & Containerization
os_base: "^24.13.0" # Current NVM version base (Used for reference)
silverblue: "^22.04" # Placeholder for the base Silverblue version

# Desktop Environment Components
hyprland: "^5.2.0" # Target version for Hyprland
waybar: "^0.11.0" # Target version for Waybar
mako: "^1.2.0"    # Target version for Notifications

# Productivity & Tooling
kitty: "^12.0"      # Target version for Kitty Terminal
mise: "^2.16.0"     # Version manager for languages/tools
chezmoi: "^0.4.0"   # Dotfiles management tool

# Virtualization & Connectivity
docker: "^20.10"    # Docker Engine minimum version
podman: "^3.4"      # Podman Engine minimum version
# tailscale: (Managed by the OS setup, not version-locked here)

# Tool Versions (used in build.sh)
hyprdynamicmonitors: "1.4.0"
walker: "2.12.2"
elephant: "2.17.2"

